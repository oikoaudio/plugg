name: Release

# A release is a pushed v<version> tag on main, matching plugg/__init__.py.
# This builds everything from that tag and leaves a draft release for the
# maintainer to read and publish; nothing is published automatically.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Build the release files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The PowerShell forwarder is Go, cross-compiled for Windows. The action
      # is pinned by commit (v6.5.0) and the toolchain by exact version.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: The tag matches the declared version
        run: |
          declared=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' plugg/__init__.py)
          test "v$declared" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match plugg/__init__.py ($declared)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Log in to ghcr.io, for the bridge builder image
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Unit tests and recipe catalogue
        run: python3 scripts/check-contribution.py

      # The bridge is built in the pinned Ubuntu 22.04 container, so it runs on
      # any distribution with glibc 2.34 and GCC 11's libstdc++ or newer. The
      # wheel built next is pinned to exactly this archive.
      - name: Bridge
        run: |
          python3 scripts/build-release-bridge.py --output dist \
            --pin "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: Python package
        run: |
          pip install --quiet --require-hashes -r packaging/release-build-requirements.txt
          python3 scripts/build-python-package.py --output dist
          python3 scripts/test-python-package.py dist/plugg-*.whl

      - name: PowerShell forwarder
        run: python3 scripts/build-powershell-forwarder.py

      # The .deb, .rpm and generic tarball hold exactly the wheel's package,
      # the bridge archive and the forwarder built above (nfpm is pinned in
      # the script). The container test installs each package with apt or
      # dnf in clean Ubuntu 24.04, Debian 13, Fedora 42 and Fedora 44 and
      # checks it as an ordinary user, so a package that does not install is
      # never drafted.
      - name: Distribution packages
        run: |
          python3 scripts/build-release-packages.py --output dist \
            --wheel dist/plugg-*.whl --bridge dist/plugg-bridge-*.tar.gz --forwarder bundle/powershell-forwarder
          python3 packaging/test-packages.py dist --output "$RUNNER_TEMP/package-test"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/plugg-*.whl
            dist/plugg-bridge-*.tar.gz
            dist/plugg_*_amd64.deb
            dist/plugg-*.x86_64.rpm
            dist/plugg-[0-9]*-x86_64.tar.gz
          if-no-files-found: error

  # Built in parallel, in a clean Arch container (see arch-package.yml).
  arch:
    uses: ./.github/workflows/arch-package.yml
    with:
      tag: ${{ github.ref_name }}

  draft:
    name: Draft the release
    needs: [release, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum plugg-*.whl plugg-bridge-*.tar.gz plugg_*_amd64.deb plugg-*.x86_64.rpm \
            plugg-[0-9]*-x86_64.tar.gz plugg-*-x86_64.pkg.tar.zst > SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A candidate (0.1.0rc1, 0.2.0b1, ...) is a pre-release, never the latest.
          case "${GITHUB_REF_NAME#v}" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*dev[0-9]*) candidate=--prerelease ;;
            *) candidate= ;;
          esac
          # The notes are a file in the repository when one exists for this tag.
          if [ -f "packaging/release-notes/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "packaging/release-notes/$GITHUB_REF_NAME.md")
          else
            notes=(--notes "Built from $GITHUB_REF_NAME by the release workflow. Write the notes before publishing.")
          fi
          gh release create "$GITHUB_REF_NAME" --draft $candidate --verify-tag --title "Plugg ${GITHUB_REF_NAME#v}" \
            "${notes[@]}" \
            dist/plugg-*.whl dist/plugg-bridge-*.tar.gz dist/plugg_*_amd64.deb dist/plugg-*.x86_64.rpm \
            dist/plugg-[0-9]*-x86_64.tar.gz dist/plugg-*-x86_64.pkg.tar.zst dist/SHA256SUMS
