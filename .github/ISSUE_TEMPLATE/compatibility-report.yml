name: Compatibility report
description: What happened when you tried a plug-in, with enough detail to reproduce it
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        **Plugg has no helpdesk.** A compatibility report is a finding others can reuse: how far a plug-in got, and what you tried. The best ones end with a fix, or a recipe. It is not a request to get your setup working.

        A factory scan is not a playback test. Report what you observed for each
        stage separately. "Installs and scans, no audio" helps more than
        "does not work".

        Do not attach installers, licence files, account data, callback URLs or
        prefixes. Trim logs to the failure and check them for personal information.
  - type: input
    id: product
    attributes:
      label: Product and exact version
      placeholder: e.g. Klevgrand Skaka 1.3.2, installer Klevgrand Helper 2.1.0
    validations: {required: true}
  - type: textarea
    id: observed
    attributes:
      label: What worked and what did not
      value: |
        - Installation:
        - Authorization:
        - Audio:
        - Editor opens:
        - Editor close and reopen:
        - Multiple instances:
        - Project saved and recalled:
    validations: {required: true}
  - type: textarea
    id: setup
    attributes:
      label: Runtime and desktop
      description: Plugg fills this in when you share a finding from Help. Otherwise give the runtime and bridge identity, Linux distribution, graphics driver, desktop and DAW version.
      value: |
        - Runtime (`plugg doctor`):
        - Distribution and kernel:
        - Graphics driver:
        - Desktop / compositor:
        - DAW and version:
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Relevant log extract
      description: Trimmed to the failure. Check it for personal information first.
      render: text
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Known fixes, recipes or settings you tried, and what each changed. "Switched to WineD3D graphics, editor draws, no change to audio" is a finding in itself.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I looked at the known fixes and Recipes & fixes for this vendor.
          required: true
        - label: I searched for an existing report of this product.
          required: true
