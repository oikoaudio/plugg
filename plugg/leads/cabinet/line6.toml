[[products]]
id = "helix-native"
name = "Helix Native"
kind = "windows"
category = "Effect"
summary = "Line 6's guitar amp and effects modelling plugin."
developer = "Line 6"
version = "3.82"
licence = "Commercial"
licensing = "A 15-day free trial runs fully featured. New licences are sold only to registered owners of Helix and HX hardware; everyone else buys the newer Helix Stadium Native instead."
formats = ["VST3"]
homepage = "https://line6.com/helix/helixnative.html"
account = "https://line6.com/account/"
description = "The HX modelling out of Line 6's Helix hardware, as a plugin: amps, cabs, mics and effects wired together on a signal path you drag into shape, with eight snapshots to switch between per preset.\n\nIt signs in to a Line 6 account to authorise, so you supply the installer you downloaded from yours."

[products.download]
source = "byo"

[products.cabinet]
runner = "9.21"
sync = "fsync"
env = ["WINEDLLOVERRIDES=*wbemprox,*wbemcomn=n"]
script = "helix-native.sh"

# Cabinet's install scripts, kept verbatim as reference. They are shell scripts
# for Cabinet's own environment ($WINE, $CABINET_PREFIX, ...) and are never run here.
[reference_scripts]
"helix-native.sh" = '''
"$WINE" "$CABINET_ARCHIVE" /S

if [ ! -f "$CABINET_PREFIX/drive_c/Program Files/Common Files/VST3/Line 6/Helix Native (x64).vst3" ]; then
    echo "$CABINET_NAME's installer left no Helix Native (x64).vst3 in the prefix" >&2
    exit 1
fi

if [ ! -f "$CABINET_PREFIX/drive_c/ProgramData/Line 6/HelixCore/HelixCoreWin_x64.dll" ]; then
    echo "$CABINET_NAME installed no HelixCore; its models did not land" >&2
    exit 1
fi
'''
