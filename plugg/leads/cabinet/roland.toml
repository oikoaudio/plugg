[[products]]
id = "roland-cloud-manager"
name = "Roland Cloud Manager"
kind = "windows"
category = "Manager"
summary = "Roland's own manager, which downloads and installs Roland Cloud software."
developer = "Roland"
version = "3.1.25"
licence = "Freeware"
licensing = "The app is free and signs in to a Roland account. ZENOLOGY Lite and some patches cost nothing; the rest needs a Roland Cloud membership or a Lifetime Key."
formats = ["VST3"]
homepage = "https://www.roland.com/global/products/rc_roland_cloud_manager/"
description = "Not a plugin but the door to Roland Cloud: ZENOLOGY, the Legendary recreations of the JUPITER-8, JUNO-106, TR-808 and D-50, the SRX expansions and sample packs. Sign in, and the app installs what your account owns and keeps it up to date.\n\nSo installing this installs nothing you can play yet — it is the door, and what you own arrives through it."

[products.download]
source = "download"
url = "https://www.rolandcloud.com/getmedia/d232d771-182c-4f58-ac6c-1aa03968819e/Roland-Cloud-Manager-Installer-3-1-25.exe"
sha256 = "c5e9b2f1bc7d0d4a4f497863d8cfb7accdcaf45a92ad32f23d76ba57987932fe"

[products.cabinet]
prefix = "roland"
runner = "9.21"
dxvk = true
sync = "fsync"
env = ["WINEDLLOVERRIDES=netprofm=d", "WINEQT_QPA_PLATFORMTHEME=windows"]
launch = "C:\\Program Files\\RolandCloudManager\\Roland Cloud Manager.exe"
launch_helper = "RCMservice.exe"
url_scheme = "rolandcloudmanager"
script = "roland.sh"

# Cabinet's install scripts, kept verbatim as reference. They are shell scripts
# for Cabinet's own environment ($WINE, $CABINET_PREFIX, ...) and are never run here.
[reference_scripts]
"roland.sh" = '''
"$WINE" "$CABINET_ARCHIVE" install --accept-licenses --default-answer --confirm-command

if [ ! -f "$CABINET_PREFIX/drive_c/Program Files/RolandCloudManager/Roland Cloud Manager.exe" ]; then
    echo "$CABINET_NAME's installer left no Roland Cloud Manager.exe in the prefix" >&2
    exit 1
fi
'''
