schema = 1
source = "cabinet"
source_url = "https://github.com/Mark12870/cabinet"
source_commit = "88a6de305c722003574559faf189548b97392f11"
source_path = "data/library/native-instruments"
licence = "GPL-3.0-or-later"
vendor = "Native Instruments"

[[products]]
id = "native-access"
name = "Native Access"
kind = "windows"
category = "Manager"
summary = "Native Instruments' manager for downloading and activating its software."
developer = "Native Instruments"
licence = "Freeware"
licensing = "The app is free, but its catalogue is tied to a Native Instruments account and the licences and subscriptions that account owns."
formats = ["VST3"]
homepage = "https://www.native-instruments.com/en/pages/native-access/"
description = "Not a plugin but the door to Native Instruments' catalogue: Kontakt, Battery, Komplete Kontrol, Massive X, FM8, Reaktor and more. Sign in, then choose the products and libraries your account owns."

[products.download]
source = "rolling"
url = "https://storage.googleapis.com/ni-assets/downloads/Native-Access_2.exe"

[products.cabinet]
prefix = "native-instruments"
runner = "d2d1-11.0"
dxvk = true
sync = "fsync"
winetricks = ["powershell", "corefonts", "vcrun2022"]
launch = "C:\\Program Files\\Native Instruments\\Native Access\\Native Access.exe"
launch_args = ["--no-sandbox", "--disable-gpu-sandbox", "--disable-gpu", "--disable-gpu-compositing", "--in-process-gpu"]
launch_service = "NTKDaemonService"
keep = "drive_c/users/Public/Documents/Native Instruments/Downloads"
script = "native-access.sh"
recover_script = "kontakt-8.sh"

# Cabinet's install scripts, kept verbatim as reference. They are shell scripts
# for Cabinet's own environment ($WINE, $CABINET_PREFIX, ...) and are never run here.
[reference_scripts]
"kontakt-8.sh" = '''
destination="$CABINET_PREFIX/drive_c/Program Files/Common Files/VST3/Kontakt 8.vst3"

if [ ! -d "$CABINET_KEPT" ] || [ -s "$destination" ]; then
    exit 0
fi

archive=$(find "$CABINET_KEPT" -maxdepth 1 -type f -iname '*kontakt*8*.zip' -printf '%T@ %p\n' | \
    sort -nr | awk '{ sub(/^[^ ]+ /, ""); print; exit }')

if [ -z "$archive" ]; then
    exit 0
fi

echo "Recovering Kontakt 8 from $(basename "$archive")"

work="$CABINET_PREFIX/drive_c/cabinet-kontakt"
rm -rf "$work"
mkdir -p "$work"
7z x -y "-o$work" "$archive" >/dev/null 2>&1 || true

source=$(find "$work" -type f -name 'Kontakt 8.vst3' | sort | tail -n 1)

if [ -z "$source" ]; then
    setup=$(find "$work" -type f -iname '*Kontakt 8*Setup PC.exe' | sort | tail -n 1)

    if [ -z "$setup" ]; then
        echo "The kept Kontakt 8 download held no installer" >&2
        rm -rf "$work"
        exit 1
    fi

    7z x -y "-o$work/payload" "$setup" >/dev/null 2>&1 || true
    source=$(find "$work/payload" -type f -name 'Kontakt 8.vst3' | sort | tail -n 1)
fi

if [ -z "$source" ] || [ ! -s "$source" ]; then
    echo "Kontakt 8's installer held no Kontakt 8.vst3 to recover" >&2
    rm -rf "$work"
    exit 1
fi

version=$(LC_ALL=C grep -aoP -m 1 \
    'P\x00r\x00o\x00d\x00u\x00c\x00t\x00V\x00e\x00r\x00s\x00i\x00o\x00n\x00\x00\x00\K(?:[0-9]\x00)+(?:\.\x00(?:[0-9]\x00)+)+' \
    "$source" | tr -d '\000')

if [ -z "$version" ]; then
    echo "Could not determine the Kontakt version from the recovered VST3" >&2
    rm -rf "$work"
    exit 1
fi

mkdir -p "$(dirname "$destination")"
cp "$source" "$destination"

"$WINE" reg add 'HKLM\SOFTWARE\Native Instruments\Kontakt 8' \
    /v InstallVST64Dir /d 'C:\Program Files\Common Files\VST3' /f
"$WINE" reg add 'HKLM\SOFTWARE\Native Instruments\Kontakt 8' \
    /v Version /d "$version" /f

products="$CABINET_PREFIX/drive_c/users/Public/Documents/Native Instruments/installed_products"
mkdir -p "$products"
printf '%s\n' "{\"InstallVST64Dir\":\"C:\\\\Program Files\\\\Common Files\\\\VST3\",\"Version\":\"$version\",\"VST3Path\":\"C:\\\\Program Files\\\\Common Files\\\\VST3\\\\Kontakt 8.vst3\"}" \
    > "$products/Kontakt 8.json"

rm -rf "$work"
rm -f "$archive" "$archive".*

echo "Recovered Kontakt 8 $version"
'''
"native-access.sh" = '''
"$WINE" winecfg -v win10

"$WINE" reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' \
    /v EnableLUA /t REG_DWORD /d 0 /f
"$WINE" reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' \
    /v ConsentPromptBehaviorAdmin /t REG_DWORD /d 0 /f

"$WINE" "$CABINET_ARCHIVE" /S

app="$CABINET_PREFIX/drive_c/Program Files/Native Instruments/Native Access/Native Access.exe"

if [ ! -f "$app" ]; then
    echo "$CABINET_NAME's installer left no Native Access.exe in the prefix" >&2
    exit 1
fi

downloads="$CABINET_PREFIX/drive_c/users/Public/Documents/Native Instruments/Downloads"
mkdir -p "$downloads"

"$WINE" reg add 'HKCU\Software\Native Instruments\Native Access' \
    /v DownloadLocation /d 'C:\users\Public\Documents\Native Instruments\Downloads' /f

daemon_dir="$CABINET_PREFIX/drive_c/Program Files/Native Instruments/Native Access/resources/daemon/win"
daemon=$(find "$daemon_dir" -maxdepth 1 -type f -name 'NTKDaemon*Setup PC.exe' | sort | tail -n 1)

if [ -z "$daemon" ]; then
    echo "$CABINET_NAME's installer left no NTKDaemon installer in the prefix" >&2
    exit 1
fi

timeout -k 5s 180s "$WINE" "$daemon" /s IAgree=Yes '/l=C:\cabinet-ntk-install.log' \
    </dev/null >/dev/null 2>&1 &
daemon_pid=$!

installed="$CABINET_PREFIX/drive_c/Program Files/Common Files/Native Instruments/NTK/NTKDaemon.exe"
found=1
deadline=$((SECONDS + 180))
while [ "$SECONDS" -lt "$deadline" ]; do
    if [ -s "$installed" ] && timeout -k 2s 5s "$WINE" sc query NTKDaemonService >/dev/null 2>&1; then
        found=0
        break
    fi

    sleep 1
done

kill "$daemon_pid" 2>/dev/null || true

if [ "$found" -ne 0 ]; then
    echo "$CABINET_NAME's daemon installer left no installed NTKDaemonService" >&2
    exit 1
fi

"$WINE" sc stop NTKDaemonService >/dev/null 2>&1 || true
'''
