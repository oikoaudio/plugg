[[products]]
id = "spitfire-audio"
name = "Spitfire Audio App"
kind = "windows"
category = "Manager"
summary = "Spitfire's own manager, which downloads and installs their libraries."
developer = "Spitfire Audio"
licence = "Freeware"
licensing = "The app is free and signs in to a Spitfire account. What it will install is what that account owns; LABS and BBC Symphony Orchestra Discover cost nothing."
formats = ["VST3", "VST2"]
homepage = "https://www.spitfireaudio.com/en-eu/pages/spitfire-audio-app"
description = "Not a plugin but the door to Spitfire's catalogue: LABS, the Originals, the BBC Symphony Orchestra. You sign in, pick from what your account owns, and the app fetches each library and installs its plugin for you.\n\nSo installing this installs nothing you can play yet — it is the door, and what you own arrives through it."

[products.download]
source = "rolling"
url = "https://www2.spitfireaudio.com/library-manager/download/win/"

[products.cabinet]
prefix = "spitfire-audio"
runner = "soda-11.0-5"
dxvk = true
sync = "system"
launch = "C:\\Program Files\\Spitfire Audio\\Spitfire Audio.exe"
script = "spitfire-audio.sh"

# Cabinet's install scripts, kept verbatim as reference. They are shell scripts
# for Cabinet's own environment ($WINE, $CABINET_PREFIX, ...) and are never run here.
[reference_scripts]
"spitfire-audio.sh" = '''
"$WINE" "$CABINET_ARCHIVE" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

if [ ! -f "$CABINET_PREFIX/drive_c/Program Files/Spitfire Audio/Spitfire Audio.exe" ]; then
    echo "$CABINET_NAME's installer left no Spitfire Audio.exe in the prefix" >&2
    exit 1
fi
'''
