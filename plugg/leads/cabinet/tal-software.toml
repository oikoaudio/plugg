description = "Bit depth and sample rate pulled down as far as you like, a noise stage beside them, and a low and high pair to keep what comes out inside a band. Companding is the new part: it lifts the quiet material before the crushing, so the damage lands on more than the peaks.\n\nA rewrite of a plugin TAL first shipped more than ten years ago, on the same algorithms with the faults taken out. The interface resizes and has a preset browser now, and presets from the old version do not load in it."

