[[products]]
id = "vital"
name = "Vital"
kind = "native"
category = "Synth"
summary = "Spectral warping wavetable synthesizer."
developer = "Matt Tytel"
version = "1.0.7 stable / 1.6.4 early access"
licence = "Freeware"
licensing = "One download serves every tier: the free version is fully functional, and Plus and Pro add presets, wavetables and skins, unlocked by signing in. 1.0.7 is the stable release. 1.6.4 is early access; presets saved in it cannot be opened by older versions."
formats = ["VST3", "VST2", "LV2", "CLAP"]
homepage = "https://vital.audio"
account = "https://account.vital.audio"
description = "Two wavetable oscillators you can draw, import or resynthesise, warped as they play by spectral modes that bend and fold the wave itself, over a sample source, two filters and a modulation matrix you build by dragging.\n\nFree, but it sits behind your account: you log in, download it, and hand Cabinet the file. The stable 1.0.7 archive provides VST3, VST2 and LV2. The 1.6.4 early-access archive provides VST3, VST2 and CLAP, but may have display or host-compatibility problems on some Linux systems."

[products.download]
source = "byo"

[products.cabinet]
relink = "libcurl-gnutls.so.4 = libcurl.so.4"
script = "vital.sh"

# Cabinet's install scripts, kept verbatim as reference. They are shell scripts
# for Cabinet's own environment ($WINE, $CABINET_PREFIX, ...) and are never run here.
[reference_scripts]
"vital.sh" = '''
unpacked="$CABINET_WORK/unpacked"
mkdir -p "$unpacked"
unzip -q -o "$CABINET_ARCHIVE" -d "$unpacked"

if [ -d "$unpacked/VitalBinaries" ]; then
    binaries="$unpacked/VitalBinaries"
    mv "$binaries/Vital.vst3" "$CABINET_DEST/"
    mv "$binaries/Vital.so" "$CABINET_DEST/"
    mv "$binaries/Vital.lv2" "$CABINET_DEST/"
elif [ -d "$unpacked/VitalInstaller/lib" ]; then
    binaries="$unpacked/VitalInstaller/lib"
    mv "$binaries/vst/Vital.so" "$CABINET_DEST/"
    mv "$binaries/vst3/Vital.vst3" "$CABINET_DEST/"
    mv "$binaries/clap/Vital.clap" "$CABINET_DEST/"
else
    echo "$CABINET_NAME's archive has an unknown layout" >&2
    exit 1
fi
'''
