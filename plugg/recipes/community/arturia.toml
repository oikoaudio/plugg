schema = 1
id = "plugg.arturia"
revision = 1
kind = "vendor"
name = "Arturia Software Center"
vendor = "Arturia"
helper_profile = "arturia"
requires = ["plugg.graphics-dxvk@1"]
notes = "Installs ASC 2.12.0.3157 into a fresh managed environment. Disables Wine UIAutomationCore in the full launcher, before Proton starts, so ASC does not hit the captured null-pointer crash at login and licence sync, and for plug-in hosts, whose JUCE editors crashed the host on close. This limits accessibility in the manager and plug-in editors. No WebView2 dependency: missing browser warnings were not the captured crash. Sign-in, product installation and refresh passed; licence sync after an automatic login passed once the override was set before Proton starts; Delay TAPE-201, Jun-6 V and Tape MELLO-FI worked in Bitwig, and closing TAPE-201's editor no longer crashed with the plug-in host setting. Fresh unattended recipe setup remains unverified; see docs/compatibility/arturia.md."

[helper]
name = "Arturia Software Center"
executable = "Program Files (x86)/Arturia/Arturia Software Center/Arturia Software Center.exe"
archive_tools = false
arguments = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]
installer_sha256 = "e92baaaa94f4635fb33b6cbad4f6397d619d07c9e0997e6460a8d64544f1bfb8"

[licensing]
vendor = "Arturia"
recovery = "deactivate-first"
note = "Preserve this environment after authorization; deactivate its products in ASC before rebuilding or moving it."
deactivate_at = "in Arturia Software Center"
