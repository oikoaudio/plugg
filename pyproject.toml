[project]
name = "plugg"
version = "0.1.0.dev0"
description = "Managed Windows plug-ins for native Linux DAWs"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[project.scripts]
plugg = "plugg.__main__:main"

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plugg"]
include-package-data = false

[tool.setuptools.package-data]
plugg = ["recipes/*.json", "recipes/community/*.toml", "leads/*/*.toml", "assets/*.ttf", "assets/*.txt"]
